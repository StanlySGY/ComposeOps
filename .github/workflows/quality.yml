name: Quality checks
on:
  workflow_call:
    inputs:
      export-images:
        description: Save the exact tested images for a stable release
        type: boolean
        default: false
permissions:
  contents: read
env:
  # GitHub runners should not make cold installs through the regional mirror
  # recorded in the lockfile. npm still verifies each locked integrity hash.
  npm_config_registry: https://registry.npmjs.org
  npm_config_replace_registry_host: registry.npmmirror.com
jobs:
  code:
    name: Tests, lint and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      # npm workspaces:根 lockfile 描述全部 workspace,一次 ci 装齐
      - run: npm ci --no-audit --no-fund
      - run: node scripts/release-notes.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm --prefix frontend run build:preview
      - uses: actions/upload-artifact@v4
        with:
          name: composeops-preview
          path: frontend/preview-dist
          retention-days: 7
  browser:
    name: Browser checks (${{ matrix.project }})
    needs: code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: desktop, engine: chromium }
          - { project: mobile, engine: chromium }
          - { project: webkit, engine: webkit }
          - { project: webkit-mobile, engine: webkit }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: composeops-preview
          path: frontend/preview-dist
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.engine }}
        working-directory: frontend
      - name: Complete preview checks for this browser
        run: npm --prefix frontend run test:preview -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces-${{ matrix.project }}
          path: frontend/test-results
          if-no-files-found: ignore
  image:
    name: Image installation, upgrade and restore
    needs: code
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies for Docker and browser integrations
        run: npm ci --no-audit --no-fund
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: composeops:ci-test
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Real Docker project workflows
        run: |
          node scripts/project-workspace-browser.mjs composeops:ci-test
          node scripts/project-workspace-browser.mjs composeops:ci-test --workspace
          node scripts/reviewed-deployment-integration.mjs
          node scripts/terminal-search-browser.mjs composeops:ci-test
      - name: Fresh installation, online backup and encrypted restore
        run: node scripts/image-smoke.mjs composeops:ci-test
      - name: Compose multi-file rollback and failure compensation
        run: node scripts/compose-recovery-integration.mjs
      - name: Volume backup and full-restore failure compensation
        run: COMPOSEOPS_DOCKER_ACCEPTANCE=1 node --test --test-concurrency=1 backend/test/volume-backup-api.integration.test.js
      - name: Upgrade from supported baseline
        run: node scripts/image-smoke.mjs composeops:ci-test stanly1997/opsdash:1.4.0
      - name: Upgrade and rollback from previous stable release
        run: node scripts/image-smoke.mjs composeops:ci-test stanly1997/opsdash:1.5.1
      - name: Export tested amd64 image
        if: inputs.export-images
        run: |
          mkdir -p verified-image
          docker save composeops:ci-test -o verified-image/image.tar
          docker image inspect --format '{{.Id}}' composeops:ci-test > verified-image/image-id.txt
      - uses: actions/upload-artifact@v4
        if: inputs.export-images
        with:
          name: composeops-image-amd64
          path: verified-image/
          compression-level: 0
          retention-days: 3
  image-arm64:
    name: ARM64 image installation and restore
    needs: code
    # The repository is public, so use GitHub's native ARM64 hosted runner.
    # QEMU emulation made this full image build take almost the entire job timeout.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Assert native ARM64 runner
        run: test "$(uname -m)" = "aarch64"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: composeops:ci-arm64
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: ARM64 installation, online backup and encrypted restore
        run: node scripts/image-smoke.mjs composeops:ci-arm64
      - name: ARM64 upgrade and rollback from previous stable release
        run: node scripts/image-smoke.mjs composeops:ci-arm64 stanly1997/opsdash:1.5.1
      - name: Export tested arm64 image
        if: inputs.export-images
        run: |
          mkdir -p verified-image
          docker save composeops:ci-arm64 -o verified-image/image.tar
          docker image inspect --format '{{.Id}}' composeops:ci-arm64 > verified-image/image-id.txt
      - uses: actions/upload-artifact@v4
        if: inputs.export-images
        with:
          name: composeops-image-arm64
          path: verified-image/
          compression-level: 0
          retention-days: 3
