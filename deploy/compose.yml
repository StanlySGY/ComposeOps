# Stable image installation. Source builds use the repository's docker-compose.yml.
services:
  opsdash:
    image: stanly1997/opsdash:${COMPOSEOPS_VERSION:-1.5.0}
    container_name: opsdash
    restart: unless-stopped
    init: true
    ports:
      - "0.0.0.0:28765:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - opsdash-data:/app/backend/data
    environment:
      SERVE_FRONTEND: "1"
      PORT: "3001"
      HOST: "0.0.0.0"
      LOG_LEVEL: info
      ENABLE_SHELL: "1"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  opsdash-data:
